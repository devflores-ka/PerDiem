plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration version "8.9.1"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// 1. CARGAR LAS PROPIEDADES DE TU LLAVE DE PRODUCCIÓN
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "com.perdiemapp.cl"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    packagingOptions {
        doNotStrip "**/*.so"
    }

    // 2. CONFIGURAR EL FIRMADO CON LA LLAVE QUE SE CARGÓ ARRIBA
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId "com.perdiemapp.cl"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode 2
        versionName "1.5.2"
    }

    buildFeatures {
        buildConfig true  // Activa la característica BuildConfig
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    buildTypes {
        release {
            // 3. CAMBIAR LA FIRMA DE DEBUG A LA DE RELEASE
            signingConfig signingConfigs.release 
            
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    //implementation 'com.google.android.gms:play-services-maps:18.1.0'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-iid'
}